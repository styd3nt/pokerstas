<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПокерСтас — Тотализатор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0: #08080d;
    --bg-1: #100f18;
    --panel: rgba(255,255,255,0.045);
    --panel-border: rgba(255,255,255,0.09);
    --panel-border-hover: rgba(198,255,61,0.35);
    --gold: #C6FF3D;
    --gold-dark: #8FCB1F;
    --violet: #8B5CF6;
    --violet-soft: #6D4FD1;
    --cream: #F4F4F8;
    --cream-dim: #8C8CA0;
    --red: #FF3E88;
    --red-dark: #B01E5C;
    --ink: #0A0A0F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(139,92,246,0.20), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(198,255,61,0.12), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(139,92,246,0.10), transparent 50%),
      var(--bg-0);
    background-attachment: fixed;
    color: var(--cream);
    min-height:100vh;
    padding: 18px 12px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .felt-dots{
    position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .wrap{ max-width: 620px; margin: 0 auto; position:relative; z-index:1; }

  /* ---- header banner ---- */
  .banner{
    background: linear-gradient(160deg, rgba(139,92,246,0.16), rgba(198,255,61,0.06));
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    padding: 22px 16px 18px;
    text-align:center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .banner::before{
    content:"";
    position:absolute; top:-40%; left:50%; transform:translateX(-50%);
    width:280px; height:180px;
    background: radial-gradient(circle, rgba(198,255,61,0.25), transparent 65%);
    pointer-events:none;
  }
  .banner h1{
    margin:0;
    position:relative;
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 30px;
    line-height:1.15;
    letter-spacing: -0.3px;
    background: linear-gradient(95deg, var(--gold) 0%, #eaff9e 30%, var(--violet) 75%, #c9aeff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .banner p{
    margin: 8px 0 0;
    position:relative;
    color: var(--cream-dim);
    font-size: 13px;
    letter-spacing: 0.2px;
    font-weight:500;
    font-family:'Inter', sans-serif;
  }

  /* ---- tabs ---- */
  .tabs{
    display:flex; gap:4px; margin-bottom:16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 5px;
    backdrop-filter: blur(16px);
  }
  .tab-btn{
    flex:1;
    padding: 10px 4px;
    border-radius: 12px;
    border: none;
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    cursor:pointer;
    background: transparent;
    color: var(--cream-dim);
    transition: all .15s ease;
  }
  .tab-btn.active{
    background: linear-gradient(120deg, var(--gold), #a8f23e 55%, #7de08a);
    color: var(--ink);
    box-shadow: 0 4px 14px rgba(198,255,61,0.25);
  }

  /* ---- panel (glass card) ---- */
  .panel{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(18px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .section-label{
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--cream);
    margin-bottom: 12px;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-family:'Sora', sans-serif;
  }
  .dim{ color: var(--cream-dim); font-size:12px; }
  .center{ text-align:center; }

  /* ---- buttons ---- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding: 11px 20px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.06);
    color: var(--cream);
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.gold{
    background: linear-gradient(120deg, var(--gold), #a8f23e 55%, #7de08a);
    color: var(--ink);
    box-shadow: 0 6px 18px rgba(198,255,61,0.22);
  }
  .btn.ghost{
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--panel-border);
    color: var(--cream-dim);
  }
  .btn.block{ width:100%; }
  .btn-row{ display:flex; gap:8px; margin-top:6px; }
  .btn-row .btn{ flex:1; }

  /* ---- chips (player picker) ---- */
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
    margin: 0 6px 6px 0;
    transition: all .12s ease;
  }
  .chip.active{
    background: linear-gradient(120deg, var(--violet), var(--violet-soft));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(139,92,246,0.35);
  }
  .chip-group{ margin-bottom:14px; }
  .cat-title{ display:flex; align-items:center; gap:6px; margin-bottom:6px; font-weight:700; font-size:13px; color:var(--cream); }

  input[type=text]{
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 10px 14px;
    color: var(--cream);
    font-family:'Inter', sans-serif;
    font-size: 13.5px;
    outline:none;
  }
  input[type=text]:focus{ border-color: var(--panel-border-hover); }

  /* ---- roster row / history row ---- */
  .row{
    display:flex; align-items:center; justify-content:space-between;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 6px;
  }
  .del{ cursor:pointer; color: var(--cream-dim); font-weight:bold; transition: color .12s ease; }
  .del:hover{ color: var(--red); }

  /* ---- chip stack (leaderboard) ---- */
  .stacks{ display:flex; align-items:flex-end; justify-content:space-around; gap:6px; overflow-x:auto; padding-top:8px; }
  .stack-col{ display:flex; flex-direction:column-reverse; align-items:center; min-width:52px; }
  .stack-piece{
    width:32px; height:9px; border-radius:20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    margin-top:-5px;
  }
  .stack-piece:first-child{ margin-top:0; }
  .stack-name{ color:var(--cream-dim); font-size:11px; margin-top:8px; text-align:center; font-weight:600; }
  .stack-num{ font-weight:700; font-size:15px; color:var(--cream); font-family: 'JetBrains Mono', monospace; }

  .suit-gold{ color: var(--gold); }
  .suit-red{ color: var(--red); }
  .footer-note{ text-align:center; color:var(--cream-dim); font-size:11px; margin-top:10px; line-height:1.5; }

  ::-webkit-scrollbar{ height:6px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="felt-dots"></div>
<div class="wrap">

  <div class="banner">
    <h1>ПокерСтас</h1>
    <p>Покерные вечера в кругу друзей</p>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

</div>

<script>
// ---------------- Supabase config ----------------
// Вставьте сюда свои значения из Project Settings → API
const SUPABASE_URL = "https://iyknetibvdqhzrfmzhtq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kicuuWIlDv8Iakt1s8-qNg_gSfufsVo";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BOARD_ID = "main";

// ---------------- storage ----------------
async function loadData(){
  try{
    const { data, error } = await supabaseClient.from("board").select("data").eq("id", BOARD_ID).single();
    if(error || !data) return {roster:[], sessions:[]};
    return data.data;
  }catch(e){ return {roster:[], sessions:[]}; }
}
async function saveData(){
  try{
    await supabaseClient.from("board").update({ data: state.data, updated_at: new Date().toISOString() }).eq("id", BOARD_ID);
  }catch(e){ console.error("Не удалось сохранить в Supabase:", e); }
}
function subscribeRealtime(){
  supabaseClient
    .channel("board-changes")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "board", filter: `id=eq.${BOARD_ID}` }, (payload) => {
      console.log("Получено обновление по realtime:", payload);
      if(payload.new && payload.new.data){
        state.data = payload.new.data;
        render();
      }
    })
    .subscribe((status) => {
      console.log("Статус realtime-подключения:", status);
    });
}

// ---------------- state ----------------
const CATS = [
  { key:"champion", label:"Чемпион вечера", hint:"у кого больше всех фишек в конце", suit:"♠", cls:"suit-gold" },
  { key:"buster",   label:"Первый вылетевший", hint:"кто первый остался без фишек", suit:"♥", cls:"suit-red" },
  { key:"bluffer",  label:"Лучшая раздача вечера", hint:"кто выиграл самую крутую раздачу", suit:"♣", cls:"suit-gold" },
];

const state = {
  data: {roster:[], sessions:[]},
  loading: true,
  tab: "tonight",
  me: "",
  picks: {champion:"", buster:"", bluffer:""},
  resultsMode: false,
  results: {champion:"", buster:"", bluffer:""},
  payouts: {},
  newPlayer: "",
  newBuyIn: 500,
  expandedHistory: null,
};

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString("ru-RU", { weekday:"short", day:"numeric", month:"long" });
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function openSession(){ return state.data.sessions.find(s => s.status === "open"); }
function completedSessions(){
  return [...state.data.sessions].filter(s=>s.status==="completed").sort((a,b)=> a.date < b.date ? 1 : -1);
}

function computeLeaderboard(){
  const totals = {};
  state.data.roster.forEach(p => totals[p] = {name:p, points:0, nights:0, champion:0, buster:0, bluffer:0, spent:0, won:0, moneyNights:0, rebuys:0});
  completedSessions().forEach(s => {
    Object.entries(s.picks||{}).forEach(([player, pick]) => {
      if(!totals[player]) totals[player] = {name:player, points:0, nights:0, champion:0, buster:0, bluffer:0, spent:0, won:0, moneyNights:0, rebuys:0};
      totals[player].nights += 1;
      CATS.forEach(c => { if(pick[c.key] && s.results && pick[c.key] === s.results[c.key]) totals[player].points += 1; });
    });
    CATS.forEach(c => {
      const w = s.results && s.results[c.key];
      if(w){
        if(!totals[w]) totals[w] = {name:w, points:0, nights:0, champion:0, buster:0, bluffer:0, spent:0, won:0, moneyNights:0, rebuys:0};
        totals[w][c.key] += 1;
      }
    });
    (s.participants||[]).forEach(player => {
      if(!totals[player]) totals[player] = {name:player, points:0, nights:0, champion:0, buster:0, bluffer:0, spent:0, won:0, moneyNights:0, rebuys:0};
      const rebuys = (s.rebuys && s.rebuys[player]) || 0;
      totals[player].spent += (1 + rebuys) * (s.buyIn || 0);
      totals[player].won += (s.payouts && s.payouts[player]) || 0;
      totals[player].rebuys += rebuys;
      totals[player].moneyNights += 1;
    });
  });
  return Object.values(totals).sort((a,b)=> b.points - a.points);
}

// ---------------- actions ----------------
function setTab(t){ state.tab = t; state.resultsMode=false; render(); }

function addPlayer(){
  const name = (state.newPlayer||"").trim();
  if(!name || state.data.roster.includes(name)) return;
  state.data.roster.push(name);
  state.newPlayer = "";
  saveData(); render();
}
function removePlayer(name){
  state.data.roster = state.data.roster.filter(p=>p!==name);
  saveData(); render();
}

function startNight(){
  const buyIn = Number(state.newBuyIn) || 0;
  state.data.sessions.push({ id:"s_"+Date.now(), date: todayISO(), status:"open", picks:{}, results:null, buyIn, participants:[], rebuys:{} });
  saveData(); render();
}

function toggleParticipant(name){
  const os = openSession();
  if(!os) return;
  if(!os.participants) os.participants = [];
  if(os.participants.includes(name)){
    os.participants = os.participants.filter(p=>p!==name);
    if(os.rebuys) delete os.rebuys[name];
  }else{
    os.participants.push(name);
    if(!os.rebuys) os.rebuys = {};
    if(os.rebuys[name] === undefined) os.rebuys[name] = 0;
  }
  saveData(); render();
}

function changeRebuy(name, delta){
  const os = openSession();
  if(!os) return;
  if(!os.rebuys) os.rebuys = {};
  const next = Math.max(0, (os.rebuys[name]||0) + delta);
  os.rebuys[name] = next;
  saveData(); render();
}

function setBuyInAmount(value){
  const os = openSession();
  if(!os) return;
  os.buyIn = Number(value) || 0;
  saveData();
}

function chooseMe(name){
  state.me = name;
  const os = openSession();
  state.picks = (os && os.picks[name]) ? {...os.picks[name]} : {champion:"", buster:"", bluffer:""};
  render();
}
function setPick(cat, name){ state.picks[cat] = name; render(); }
function submitPicks(){
  const os = openSession();
  if(!os || !state.me || !state.picks.champion || !state.picks.buster || !state.picks.bluffer) return;
  os.picks[state.me] = {...state.picks};
  saveData(); render();
}

function sessionPot(s){
  const participants = s.participants || [];
  const rebuys = s.rebuys || {};
  return participants.reduce((sum,p) => sum + (1+(rebuys[p]||0)) * (s.buyIn||0), 0);
}

function toggleResultsMode(v){
  if(v){
    const os = openSession();
    state.payouts = {};
    (os && os.participants || []).forEach(p => { state.payouts[p] = (os.payouts && os.payouts[p]) || 0; });
  }
  state.resultsMode = v;
  render();
}
function setResult(cat, name){ state.results[cat] = name; render(); }

function sumPayouts(){
  return Object.values(state.payouts||{}).reduce((a,b)=> a + (Number(b)||0), 0);
}
function onPayoutInput(el, name){
  state.payouts[name] = Number(el.value) || 0;
  const os = openSession();
  const pot = os ? sessionPot(os) : 0;
  const sum = sumPayouts();
  const span = document.getElementById("payoutTotal");
  if(span){
    span.textContent = `${sum} / ${pot} ₽`;
    span.style.color = (sum !== pot) ? "var(--red)" : "var(--gold)";
  }
}

function submitResults(){
  const os = openSession();
  if(!os || !state.results.champion || !state.results.buster || !state.results.bluffer) return;
  os.status = "completed";
  os.results = {...state.results};
  os.payouts = {...state.payouts};
  state.results = {champion:"", buster:"", bluffer:""};
  state.payouts = {};
  state.resultsMode = false;
  state.me = ""; state.picks = {champion:"", buster:"", bluffer:""};
  saveData(); render();
}

function toggleHistory(id){ state.expandedHistory = state.expandedHistory===id ? null : id; render(); }

function deleteSession(id){
  if(!confirm("Удалить этот вечер из истории? Это действие нельзя отменить.")) return;
  state.data.sessions = state.data.sessions.filter(s => s.id !== id);
  saveData(); render();
}

function clearAllHistory(){
  if(!confirm("Очистить всю статистику и историю вечеров? Список игроков останется, но все прошлые результаты, очки и финансы удалятся безвозвратно.")) return;
  state.data.sessions = state.data.sessions.filter(s => s.status !== "completed");
  saveData(); render();
}

// ---------------- render ----------------
function renderTabs(){
  const tabs = [["tonight","Сегодня"],["leaderboard","Таблица лидеров"],["history","История"],["roster","Состав"]];
  return tabs.map(([k,l]) => `<button class="tab-btn ${state.tab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join("");
}

function chipRow(catKey, selected, roster, onClickName){
  return `<div class="chip-group">` +
    roster.map(p => `<span class="chip ${selected===p?'active':''}" onclick="${onClickName}('${catKey}','${esc(p)}')">${esc(p)}</span>`).join("") +
  `</div>`;
}

function renderTonight(){
  const os = openSession();
  const roster = state.data.roster;
  const activePlayers = (os && os.participants && os.participants.length) ? os.participants : roster;

  if(!os){
    return `<div class="panel center">
      <div style="font-size:28px;margin-bottom:6px;">🎲</div>
      <p>Сегодня ещё не открыт покерный вечер.</p>
      ${roster.length < 2
        ? `<p class="dim">Сначала добавьте минимум двух игроков во вкладке «Состав».</p>`
        : `<div style="display:flex; gap:8px; justify-content:center; align-items:center; margin-bottom:12px;">
             <span class="dim">Бай-ин, ₽</span>
             <input type="text" inputmode="numeric" value="${esc(String(state.newBuyIn))}" oninput="state.newBuyIn=this.value" style="width:90px; text-align:center;">
           </div>
           <button class="btn gold" onclick="startNight()">Открыть вечер</button>`}
    </div>`;
  }

  if(state.resultsMode){
    return `<div class="panel">
      <div class="section-label">Как всё было на самом деле</div>
      ${CATS.map(c => `
        <div class="cat-title"><span class="${c.cls}">${c.suit}</span> ${c.label}</div>
        ${chipRow(c.key, state.results[c.key], activePlayers, "setResult")}
      `).join("")}
    </div>
    ${renderPayoutsPanel(os)}
    <div class="btn-row">
      <button class="btn ghost" onclick="toggleResultsMode(false)">Назад</button>
      <button class="btn gold" ${(!state.results.champion||!state.results.buster||!state.results.bluffer)?'disabled':''} onclick="submitResults()">Закрыть вечер</button>
    </div>`;
  }

  const lockedCount = Object.keys(os.picks||{}).length;
  return `
    ${renderMoneyPanel(os, roster)}
    <div class="panel">
      <div class="section-label"><span>${fmtDate(os.date)} — приём прогнозов</span><span class="dim">${lockedCount}/${activePlayers.length} готово</span></div>
      ${activePlayers.length < roster.length ? `<p class="dim" style="margin-top:-6px; margin-bottom:10px;">Играют сегодня: ${activePlayers.map(esc).join(", ")}</p>` : ``}
      <div class="section-label" style="margin-top:12px;">Кто голосует</div>
      <div class="chip-group">
        ${activePlayers.map(p => `<span class="chip ${state.me===p?'active':''}" onclick="chooseMe('${esc(p)}')">${os.picks[p]?'✓ ':''}${esc(p)}</span>`).join("")}
      </div>
      ${state.me ? `
        ${CATS.map(c => `
          <div class="cat-title"><span class="${c.cls}">${c.suit}</span> ${c.label} <span class="dim">— ${c.hint}</span></div>
          ${chipRow(c.key, state.picks[c.key], activePlayers, "setPick")}
        `).join("")}
        <button class="btn gold block" ${(!state.picks.champion||!state.picks.buster||!state.picks.bluffer)?'disabled':''} onclick="submitPicks()">
          ${os.picks[state.me] ? "Обновить мои прогнозы" : "Зафиксировать мои прогнозы"}
        </button>
      ` : ``}
    </div>
    <button class="btn ghost block" onclick="toggleResultsMode(true)">Игра окончена — ввести результаты »</button>
  `;
}

function renderMoneyPanel(os, roster){
  const participants = os.participants || [];
  const rebuys = os.rebuys || {};
  const total = sessionPot(os);
  return `
    <div class="panel">
      <div class="section-label">
        <span>💰 Деньги</span>
        <span style="display:flex; align-items:center; gap:6px;">
          <span class="dim">Бай-ин, ₽</span>
          <input type="text" inputmode="numeric" value="${esc(String(os.buyIn||0))}" onchange="setBuyInAmount(this.value)" style="width:70px; text-align:center; padding:5px 8px;">
        </span>
      </div>
      <div class="dim" style="margin-bottom:6px;">Кто играет</div>
      <div class="chip-group">
        ${roster.map(p => `<span class="chip ${participants.includes(p)?'active':''}" onclick="toggleParticipant('${esc(p)}')">${esc(p)}</span>`).join("")}
      </div>
      ${participants.length ? `
        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:8px;">
          ${participants.map(p => {
            const rb = rebuys[p] || 0;
            const spent = (1+rb) * (os.buyIn||0);
            return `
              <div class="row">
                <span>${esc(p)}</span>
                <span style="display:flex; align-items:center; gap:10px;">
                  <span style="display:flex; align-items:center; gap:6px;">
                    <button class="btn ghost" style="padding:4px 10px;" onclick="changeRebuy('${esc(p)}', -1)">−</button>
                    <span class="dim" style="min-width:70px; text-align:center;">докупок: ${rb}</span>
                    <button class="btn ghost" style="padding:4px 10px;" onclick="changeRebuy('${esc(p)}', 1)">+</button>
                  </span>
                  <span style="font-weight:bold; font-family:'JetBrains Mono', monospace; color:var(--gold); min-width:60px; text-align:right;">${spent} ₽</span>
                </span>
              </div>
            `;
          }).join("")}
        </div>
        <div class="section-label" style="margin-bottom:0;"><span>Общий банк</span><span style="color:var(--gold); font-family:'JetBrains Mono', monospace;">${total} ₽</span></div>
      ` : `<p class="dim">Отметьте, кто сегодня играет.</p>`}
    </div>
  `;
}

function renderPayoutsPanel(os){
  const participants = os.participants || [];
  const pot = sessionPot(os);
  if(!participants.length){
    return `<div class="panel"><div class="section-label">🏆 Выигрыш</div><p class="dim">Во вкладке «Деньги» никто не отмечен как играющий — нечего делить.</p></div>`;
  }
  const sum = sumPayouts();
  return `
    <div class="panel">
      <div class="section-label"><span>🏆 Выигрыш</span></div>
      <p class="dim" style="margin-bottom:10px;">Впишите, кто сколько забрал — банк можно поделить как угодно: всё победителю, на двоих, на троих и т.д.</p>
      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;">
        ${participants.map(p => `
          <div class="row">
            <span>${esc(p)}</span>
            <span style="display:flex; align-items:center; gap:6px;">
              <input type="text" inputmode="numeric" value="${esc(String(state.payouts[p]||0))}" oninput="onPayoutInput(this,'${esc(p)}')" style="width:80px; text-align:right; padding:5px 8px;"> ₽
            </span>
          </div>
        `).join("")}
      </div>
      <div class="section-label" style="margin-bottom:0;">
        <span>Роздано</span>
        <span id="payoutTotal" style="color:${sum!==pot?'var(--red)':'var(--gold)'}; font-family:'JetBrains Mono', monospace;">${sum} / ${pot} ₽</span>
      </div>
    </div>
  `;
}

function pluralRu(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10===1 && mod100!==11) return one;
  if(mod10>=2 && mod10<=4 && (mod100<10 || mod100>=20)) return few;
  return many;
}

function renderLeaderboard(){
  const lb = computeLeaderboard();
  const predictors = lb.filter(p => p.nights > 0).sort((a,b)=> b.points - a.points);
  const maxPoints = Math.max(1, ...predictors.map(p=>p.points));
  const medals = ["🥇","🥈","🥉"];
  const predictorsHtml = predictors.map((p,i) => {
    const pct = Math.round((p.points / maxPoints) * 100);
    return `
      <div class="row" style="flex-direction:column; align-items:stretch; gap:7px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:700; display:flex; align-items:center; gap:6px;">
            <span style="min-width:22px;">${medals[i] || ('#'+(i+1))}</span> ${esc(p.name)}
          </span>
          <span style="font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--gold);">${p.points} ${pluralRu(p.points,'очко','очка','очков')}</span>
        </div>
        <div style="height:6px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden;">
          <div style="height:100%; width:${pct}%; background:linear-gradient(90deg, var(--gold), #7de08a); border-radius:4px;"></div>
        </div>
      </div>
    `;
  }).join("");

  const fame = lb.filter(p => p.champion+p.buster+p.bluffer > 0)
    .sort((a,b)=> (b.champion+b.buster+b.bluffer) - (a.champion+a.buster+a.bluffer))
    .map(p => `
      <div class="row">
        <span style="font-weight:bold;">${esc(p.name)}</span>
        <span class="dim" style="display:flex; gap:10px;">
          ${p.champion? `<span class="suit-gold">${p.champion}× чемпион</span>`:''}
          ${p.buster? `<span class="suit-red">${p.buster}× первый вылет</span>`:''}
          ${p.bluffer? `<span class="suit-gold">${p.bluffer}× лучшая раздача</span>`:''}
        </span>
      </div>
    `).join("");

  const money = lb.filter(p => p.moneyNights > 0)
    .sort((a,b)=> (b.won-b.spent) - (a.won-a.spent))
    .map(p => {
      const net = p.won - p.spent;
      return `
      <div class="row">
        <span style="font-weight:bold;">${esc(p.name)}</span>
        <span class="dim" style="display:flex; gap:10px; align-items:center;">
          <span>${p.moneyNights} вечеров</span>
          <span>${p.rebuys} докупок</span>
          <span style="color:${net>=0?'#7CFFC4':'var(--red)'}; font-family:'JetBrains Mono', monospace; font-weight:bold;">${net>=0?'+':''}${net} ₽</span>
        </span>
      </div>
    `;}).join("");

  return `
    <div class="panel">
      <div class="section-label">Самые точные прогнозы</div>
      ${predictorsHtml || `<p class="dim">Очков пока нет — они появятся после первого закрытого вечера.</p>`}
    </div>
    <div class="panel">
      <div class="section-label">Зал славы (реальные результаты)</div>
      ${fame || `<p class="dim">В зале славы пока никого нет.</p>`}
    </div>
    <div class="panel">
      <div class="section-label">💰 Финансы</div>
      ${money || `<p class="dim">Пока никто не платил бай-ин.</p>`}
    </div>
    ${completedSessions().length ? `<button class="btn ghost block" onclick="clearAllHistory()">Очистить всю статистику</button>` : ``}
  `;
}

function renderHistory(){
  const list = completedSessions();
  if(list.length === 0) return `<div class="panel center"><p class="dim">Записей о вечерах пока нет.</p></div>`;
  return list.map(s => {
    const open = state.expandedHistory === s.id;
    const participants = s.participants || [];
    const rebuys = s.rebuys || {};
    const total = participants.reduce((sum,p) => sum + (1+(rebuys[p]||0)) * (s.buyIn||0), 0);
    const picksHtml = `
      <div class="dim" style="margin-bottom:8px;">🎯 Прогнозы игроков</div>
      ${Object.keys(s.picks).length ? Object.entries(s.picks).map(([player,pick]) => `
        <div class="row" style="background:transparent; padding:4px 0;">
          <span class="dim">${esc(player)}</span>
          <span style="display:flex; gap:10px;">
            ${CATS.map(c => {
              const correct = pick[c.key] === s.results[c.key];
              return `<span title="${esc(c.label)}" style="color:${correct?'var(--gold)':'var(--cream-dim)'};font-size:12px;">${c.suit} ${correct?'✓':'✕'} ${esc(pick[c.key]||'—')}</span>`;
            }).join("")}
          </span>
        </div>
      `).join("") : `<p class="dim">В этот вечер никто не делал прогнозов.</p>`}
    `;
    const moneyHtml = participants.length ? `
      <div style="margin-top:10px; border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">
        <div class="dim" style="margin-bottom:6px;">💰 Бай-ин ${s.buyIn||0} ₽ · банк ${total} ₽</div>
        ${participants.map(p => {
          const spent = (1+(rebuys[p]||0))*(s.buyIn||0);
          const won = (s.payouts && s.payouts[p]) || 0;
          const net = won - spent;
          return `
          <div class="row" style="background:transparent; padding:4px 0;">
            <span class="dim">${esc(p)}</span>
            <span class="dim" style="display:flex; gap:8px; align-items:center;">
              <span>докупок: ${rebuys[p]||0}</span>
              <span>получил ${won} ₽</span>
              <span style="color:${net>=0?'#7CFFC4':'var(--red)'}; font-weight:bold;">${net>=0?'+':''}${net} ₽</span>
            </span>
          </div>
        `;}).join("")}
      </div>
    ` : "";
    return `
      <div class="panel">
        <div class="row" style="background:transparent; padding:0; margin-bottom:10px;">
          <span style="font-weight:700;">${fmtDate(s.date)}</span>
          <span class="del" title="Удалить вечер" onclick="deleteSession('${s.id}')">✕</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
          ${CATS.map(c => `
            <div class="row" style="background:rgba(255,255,255,0.03);">
              <span class="dim" style="display:flex; align-items:center; gap:7px;"><span class="${c.cls}" style="font-size:15px;">${c.suit}</span> ${c.label}</span>
              <span style="font-weight:700; color:var(--cream);">${esc(s.results[c.key]||'—')}</span>
            </div>
          `).join("")}
        </div>
        <button class="btn ghost block" onclick="toggleHistory('${s.id}')">${open ? 'Скрыть прогнозы и деньги' : 'Прогнозы и деньги »'}</button>
        ${open ? `<div style="margin-top:12px; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">${picksHtml}</div>${moneyHtml}` : ``}
      </div>
    `;
  }).join("");
}

function renderRoster(){
  const roster = state.data.roster;
  return `
    <div class="panel">
      <div class="section-label">Компания</div>
      ${roster.length===0 ? `<p class="dim">Добавьте друзей, чтобы начать.</p>` : roster.map(p => `
        <div class="row">
          <span>${esc(p)}</span>
          <span class="del" onclick="removePlayer('${esc(p)}')">✕</span>
        </div>
      `).join("")}
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input type="text" id="newPlayerInput" placeholder="Имя друга" value="${esc(state.newPlayer)}"
          oninput="state.newPlayer=this.value" onkeydown="if(event.key==='Enter') addPlayer()" style="flex:1;">
        <button class="btn gold" onclick="addPlayer()">+ Добавить</button>
      </div>
    </div>
    <p class="footer-note">Данные синхронизируются в реальном времени — все, кто открыл сайт, видят одни и те же прогнозы и результаты.</p>
  `;
}

function render(){
  if(state.loading){
    document.getElementById("tabs").innerHTML = "";
    document.getElementById("content").innerHTML = `<div class="panel center"><p>Загрузка стола…</p></div>`;
    return;
  }
  document.getElementById("tabs").innerHTML = renderTabs();
  const c = document.getElementById("content");
  if(state.tab === "tonight") c.innerHTML = renderTonight();
  else if(state.tab === "leaderboard") c.innerHTML = renderLeaderboard();
  else if(state.tab === "history") c.innerHTML = renderHistory();
  else if(state.tab === "roster") c.innerHTML = renderRoster();

  const input = document.getElementById("newPlayerInput");
  if(input) input.focus({preventScroll:true});
}

async function initApp(){
  state.data = await loadData();
  state.loading = false;
  render();
  subscribeRealtime();
}
initApp();
</script>
</body>
</html>
