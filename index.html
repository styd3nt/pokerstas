<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Покер для своих</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0: #08080d;
    --bg-1: #100f18;
    --panel: rgba(255,255,255,0.045);
    --panel-border: rgba(255,255,255,0.09);
    --panel-border-hover: rgba(198,255,61,0.35);
    --gold: #C6FF3D;
    --gold-dark: #8FCB1F;
    --violet: #8B5CF6;
    --violet-soft: #6D4FD1;
    --cream: #F4F4F8;
    --cream-dim: #8C8CA0;
    --red: #FF3E88;
    --red-dark: #B01E5C;
    --ink: #0A0A0F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(139,92,246,0.20), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(198,255,61,0.12), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(139,92,246,0.10), transparent 50%),
      var(--bg-0);
    background-attachment: fixed;
    color: var(--cream);
    min-height:100vh;
    padding: 18px 12px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .felt-dots{
    position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .wrap{ max-width: 620px; margin: 0 auto; position:relative; z-index:1; }

  /* ---- header banner ---- */
  .banner{
    background: linear-gradient(160deg, rgba(139,92,246,0.16), rgba(198,255,61,0.06));
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    padding: 22px 16px 18px;
    text-align:center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .banner::before{
    content:"";
    position:absolute; top:-40%; left:50%; transform:translateX(-50%);
    width:280px; height:180px;
    background: radial-gradient(circle, rgba(198,255,61,0.25), transparent 65%);
    pointer-events:none;
  }
  .banner h1{
    margin:0;
    position:relative;
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 28px;
    line-height:1.15;
    letter-spacing: -0.3px;
    background: linear-gradient(95deg, var(--gold) 0%, #eaff9e 30%, var(--violet) 75%, #c9aeff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .banner p{
    margin: 8px 0 0;
    position:relative;
    color: var(--cream-dim);
    font-size: 13px;
    letter-spacing: 0.2px;
    font-weight:500;
    font-family:'Inter', sans-serif;
  }

  /* ---- account bar ---- */
  #accountBar .row{ margin-bottom: 14px; }

  /* ---- tabs ---- */
  .tabs{
    display:flex; gap:4px; margin-bottom:16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 5px;
    backdrop-filter: blur(16px);
  }
  .tab-btn{
    flex:1;
    padding: 10px 4px;
    border-radius: 12px;
    border: none;
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    cursor:pointer;
    background: transparent;
    color: var(--cream-dim);
    transition: all .15s ease;
  }
  .tab-btn.active{
    background: linear-gradient(120deg, var(--gold), #a8f23e 55%, #7de08a);
    color: var(--ink);
    box-shadow: 0 4px 14px rgba(198,255,61,0.25);
  }

  /* ---- panel (glass card) ---- */
  .panel{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(18px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .section-label{
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--cream);
    margin-bottom: 12px;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-family:'Sora', sans-serif;
  }
  .dim{ color: var(--cream-dim); font-size:12px; }
  .center{ text-align:center; }

  /* ---- buttons ---- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding: 11px 20px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.06);
    color: var(--cream);
    font-family:'Sora', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.gold{
    background: linear-gradient(120deg, var(--gold), #a8f23e 55%, #7de08a);
    color: var(--ink);
    box-shadow: 0 6px 18px rgba(198,255,61,0.22);
  }
  .btn.ghost{
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--panel-border);
    color: var(--cream-dim);
  }
  .btn.block{ width:100%; }
  .btn-row{ display:flex; gap:8px; margin-top:6px; }
  .btn-row .btn{ flex:1; }

  /* ---- chips (player/team picker) ---- */
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
    margin: 0 6px 6px 0;
    transition: all .12s ease;
  }
  .chip.active{
    background: linear-gradient(120deg, var(--violet), var(--violet-soft));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(139,92,246,0.35);
  }
  .chip-group{ margin-bottom:14px; }
  .cat-title{ display:flex; align-items:center; gap:6px; margin-bottom:6px; font-weight:700; font-size:13px; color:var(--cream); }

  input[type=text], input[type=password]{
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 10px 14px;
    color: var(--cream);
    font-family:'Inter', sans-serif;
    font-size: 13.5px;
    outline:none;
    width:100%;
  }
  input[type=text]:focus, input[type=password]:focus{ border-color: var(--panel-border-hover); }

  /* ---- rows ---- */
  .row{
    display:flex; align-items:center; justify-content:space-between;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 6px;
  }
  .del{ cursor:pointer; color: var(--cream-dim); font-weight:bold; transition: color .12s ease; }
  .del:hover{ color: var(--red); }

  .suit-gold{ color: var(--gold); }
  .suit-red{ color: var(--red); }
  .footer-note{ text-align:center; color:var(--cream-dim); font-size:11px; margin-top:10px; line-height:1.5; }
  .msg-error{ color: var(--red); font-size:13px; margin:0 0 10px; font-weight:600; }
  .msg-ok{ color: #7CFFC4; font-size:13px; margin:0 0 10px; font-weight:600; }

  ::-webkit-scrollbar{ height:6px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="felt-dots"></div>
<div class="wrap">

  <div class="banner">
    <h1>Покер для своих</h1>
    <p>Покерные вечера в кругу друзей</p>
  </div>

  <div id="accountBar"></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

</div>

<script>
// ======================================================================
// Supabase config
// ======================================================================
const SUPABASE_URL = "https://iyknetibvdqhzrfmzhtq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kicuuWIlDv8Iakt1s8-qNg_gSfufsVo";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ======================================================================
// auth helpers
// ======================================================================
function usernameToSlug(u){
  return (u||"").trim().toLowerCase().replace(/[^a-z0-9_.-]/g,"");
}
function usernameToEmail(slug){
  return `u-${slug}@pokerdlyasvoih.local`;
}

// ======================================================================
// categories
// ======================================================================
const CATS = [
  { key:"champion", label:"Чемпион вечера", hint:"у кого больше всех фишек в конце", suit:"♠", cls:"suit-gold" },
  { key:"buster",   label:"Первый вылетевший", hint:"кто первый остался без фишек", suit:"♥", cls:"suit-red" },
  { key:"bluffer",  label:"Лучшая раздача вечера", hint:"кто выиграл самую крутую раздачу", suit:"♣", cls:"suit-gold" },
];

// ======================================================================
// state
// ======================================================================
const state = {
  booting: true,
  session: null,
  profile: null,

  authView: "login",
  authForm: { username:"", password:"", password2:"" },
  authError: "", authNotice: "", authBusy: false,

  teams: [],
  activeTeamId: null,
  dataLoading: true,
  newTeamName: "",
  inviteUsername: "",
  inviteError: "",
  members: [],
  membersDetailed: [],
  realtimeChannel: null,

  settingsOpen: false,
  settingsForm: { firstName:"", lastName:"", nickname:"" },
  settingsError: "", settingsNotice: "",
  passwordForm: { p1:"", p2:"" },
  passwordError: "", passwordNotice: "",

  data: { sessions: [] },
  tab: "tonight",
  me: "",
  picks: {champion:"", buster:"", bluffer:""},
  resultsMode: false,
  results: {champion:"", buster:"", bluffer:""},
  payouts: {},
  newBuyIn: 500,
  expandedHistory: null,
  hallTab: "champion",
  expandedFinanceUser: null,

  myStatsLoading: false,
  myStatsByTeam: [],
  myStatsOverall: { totalNet: 0, gamesCount: 0 },
  expandedProfileTeam: null,
};

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+"T12:00:00");
  return d.toLocaleDateString("ru-RU", { weekday:"short", day:"numeric", month:"long" });
}
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ======================================================================
// auth actions
// ======================================================================
async function registerSubmit(){
  const { username, password, password2 } = state.authForm;
  state.authError = ""; state.authNotice = "";
  const slug = usernameToSlug(username);
  if(!slug){ state.authError = "Логин должен содержать латинские буквы или цифры."; render(); return; }
  if(password.length < 4){ state.authError = "Пароль должен быть не короче 4 символов."; render(); return; }
  if(password !== password2){ state.authError = "Пароли не совпадают — проверьте оба поля."; render(); return; }

  state.authBusy = true; render();

  const { data: existing } = await supabaseClient.from("profiles").select("id").eq("username", slug).maybeSingle();
  if(existing){
    state.authBusy = false; state.authError = "Такой логин уже занят, выберите другой.";
    render(); return;
  }

  const { data, error } = await supabaseClient.auth.signUp({ email: usernameToEmail(slug), password });
  if(error || !data.user){
    state.authBusy = false;
    state.authError = "Не удалось зарегистрироваться: " + (error?.message || "неизвестная ошибка");
    render(); return;
  }

  const { error: profErr } = await supabaseClient.from("profiles").insert({ id: data.user.id, username: slug });
  if(profErr){
    state.authBusy = false;
    state.authError = "Аккаунт создан, но профиль не сохранился: " + profErr.message;
    render(); return;
  }

  state.authBusy = false;
  state.authForm = { username:"", password:"", password2:"" };

  if(data.session){
    state.authNotice = "Готово! Вы зарегистрированы и вошли в аккаунт.";
    await onAuthReady(data.session);
  }else{
    state.authNotice = "Регистрация прошла успешно — теперь войдите под своим логином.";
    state.authView = "login";
    render();
  }
}

async function loginSubmit(){
  const { username, password } = state.authForm;
  state.authError = "";
  const slug = usernameToSlug(username);
  if(!slug || !password){ state.authError = "Введите логин и пароль."; render(); return; }

  state.authBusy = true; render();
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email: usernameToEmail(slug), password });
  state.authBusy = false;

  if(error){ state.authError = "Неверный логин или пароль."; render(); return; }
  state.authForm = { username:"", password:"", password2:"" };
  await onAuthReady(data.session);
}

function switchAuthView(v){ state.authView = v; state.authError=""; state.authNotice=""; render(); }

async function forgotPasswordSubmit(){
  const { username, password, password2 } = state.authForm;
  state.authError = ""; state.authNotice = "";
  const slug = usernameToSlug(username);
  if(!slug){ state.authError = "Введите ваш логин."; render(); return; }
  if(password.length < 4){ state.authError = "Пароль должен быть не короче 4 символов."; render(); return; }
  if(password !== password2){ state.authError = "Пароли не совпадают — проверьте оба поля."; render(); return; }

  state.authBusy = true; render();
  const { data, error } = await supabaseClient.functions.invoke("forgot-password", { body: { username: slug, newPassword: password } });
  state.authBusy = false;

  if(error || (data && data.error)){
    state.authError = data?.error || error?.message || "Не удалось сбросить пароль.";
    render(); return;
  }
  state.authForm = { username:"", password:"", password2:"" };
  state.authNotice = "Пароль обновлён — теперь войдите с новым паролем.";
  state.authView = "login";
  render();
}

async function logout(){
  await supabaseClient.auth.signOut();
}

async function onAuthReady(session){
  state.session = session;
  const { data: profile } = await supabaseClient.from("profiles").select("username, first_name, last_name, nickname").eq("id", session.user.id).maybeSingle();
  state.profile = {
    id: session.user.id,
    username: profile?.username || "",
    firstName: profile?.first_name || "",
    lastName: profile?.last_name || "",
    nickname: profile?.nickname || "",
  };
  await loadTeams();

  let target = null;
  try{
    const saved = localStorage.getItem("poker-active-team");
    if(saved && state.teams.find(t=>t.id===saved)) target = saved;
  }catch(e){}
  if(!target && state.teams[0]) target = state.teams[0].id;

  state.booting = false;
  if(target){ await selectTeam(target); }
  else{ state.tab = "team"; render(); }
}

function nameFromRecord(r){
  if(!r) return "";
  return [r.firstName, r.lastName].filter(Boolean).join(" ") || r.nickname || r.username;
}
function myDisplayName(){ return nameFromRecord(state.profile); }
function displayNameFor(username){
  const m = state.membersDetailed.find(x=>x.username===username);
  return m ? nameFromRecord(m) : username;
}

function openSettings(){
  state.settingsForm = { firstName: state.profile.firstName||"", lastName: state.profile.lastName||"", nickname: state.profile.nickname||"" };
  state.passwordForm = { p1:"", p2:"" };
  state.settingsError=""; state.settingsNotice=""; state.passwordError=""; state.passwordNotice="";
  state.settingsOpen = true;
  render();
  loadMyCrossTeamStats();
}
function closeSettings(){ state.settingsOpen = false; render(); }

function toggleProfileTeam(teamId){ state.expandedProfileTeam = state.expandedProfileTeam===teamId ? null : teamId; render(); }

async function loadMyCrossTeamStats(){
  state.myStatsLoading = true; render();
  const results = [];
  for(const t of state.teams){
    const { data } = await supabaseClient.from("board").select("data").eq("id", t.id).maybeSingle();
    const sessions = (data?.data?.sessions || []).filter(s => s.status === "completed");
    const games = [];
    sessions.forEach(s => {
      const participants = s.participants || [];
      if(participants.includes(state.profile.username)){
        const rebuys = (s.rebuys && s.rebuys[state.profile.username]) || 0;
        const spent = (1+rebuys) * (s.buyIn||0);
        const won = (s.payouts && s.payouts[state.profile.username]) || 0;
        games.push({ date: s.date, net: won - spent });
      }
    });
    games.sort((a,b)=> a.date < b.date ? 1 : -1);
    const totalNet = games.reduce((sum,g)=>sum+g.net, 0);
    results.push({ teamId: t.id, teamName: t.name, role: t.role, games, totalNet });
  }
  state.myStatsByTeam = results;
  state.myStatsOverall = {
    totalNet: results.reduce((s,r)=>s+r.totalNet, 0),
    gamesCount: results.reduce((s,r)=>s+r.games.length, 0),
  };
  state.myStatsLoading = false;
  render();
}

async function saveProfileSettings(){
  state.settingsError=""; state.settingsNotice="";
  const firstName = (state.settingsForm.firstName||"").trim();
  const lastName = (state.settingsForm.lastName||"").trim();
  const nickname = (state.settingsForm.nickname||"").trim();
  if(!firstName){ state.settingsError = "Имя обязательно для заполнения."; render(); return; }
  const { error } = await supabaseClient.from("profiles").update({
    first_name: firstName, last_name: lastName || null, nickname: nickname || null
  }).eq("id", state.profile.id);
  if(error){ state.settingsError = "Не удалось сохранить: " + error.message; render(); return; }
  state.profile.firstName = firstName; state.profile.lastName = lastName; state.profile.nickname = nickname;
  state.settingsNotice = "Профиль обновлён.";
  if(state.activeTeamId) await loadMembers(state.activeTeamId);
  render();
}

async function changePasswordSubmit(){
  state.passwordError=""; state.passwordNotice="";
  const { p1, p2 } = state.passwordForm;
  if((p1||"").length < 4){ state.passwordError = "Пароль должен быть не короче 4 символов."; render(); return; }
  if(p1 !== p2){ state.passwordError = "Пароли не совпадают."; render(); return; }
  const { error } = await supabaseClient.auth.updateUser({ password: p1 });
  if(error){ state.passwordError = "Не удалось сменить пароль: " + error.message; render(); return; }
  state.passwordForm = { p1:"", p2:"" };
  state.passwordNotice = "Пароль изменён.";
  render();
}

// ======================================================================
// team actions
// ======================================================================
async function loadTeams(){
  const { data } = await supabaseClient
    .from("team_members")
    .select("role, teams(id, name, owner_id)")
    .eq("user_id", state.profile.id);
  state.teams = (data||[]).filter(r=>r.teams).map(r => ({ id:r.teams.id, name:r.teams.name, role:r.role, ownerId:r.teams.owner_id }));
}

async function createTeamSubmit(){
  const name = (state.newTeamName||"").trim();
  if(!name) return;
  const newId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now()+"-"+Math.random().toString(16).slice(2));
  const { error } = await supabaseClient.from("teams").insert({ id: newId, name, owner_id: state.profile.id });
  if(error){ alert("Не удалось создать команду: " + error.message); return; }
  const { error: memErr } = await supabaseClient.from("team_members").insert({ team_id: newId, user_id: state.profile.id, role: "owner" });
  if(memErr){ alert("Команда создана, но не удалось добавить вас как владельца: " + memErr.message); return; }
  state.newTeamName = "";
  await loadTeams();
  await selectTeam(newId);
}

async function selectTeam(teamId){
  if(state.realtimeChannel){ supabaseClient.removeChannel(state.realtimeChannel); state.realtimeChannel = null; }
  state.activeTeamId = teamId;
  try{ localStorage.setItem("poker-active-team", teamId); }catch(e){}
  state.dataLoading = true;
  if(state.tab !== "team") state.tab = "tonight";
  state.me=""; state.resultsMode=false; state.expandedHistory=null;
  render();

  await loadMembers(teamId);
  await loadBoardData(teamId);
  state.dataLoading = false;
  subscribeBoardRealtime(teamId);
  render();
}

async function loadMembers(teamId){
  const { data } = await supabaseClient
    .from("team_members")
    .select("role, user_id, profiles(username, first_name, last_name, nickname)")
    .eq("team_id", teamId);
  const rows = (data||[]).filter(r=>r.profiles);
  state.membersDetailed = rows.map(r => ({
    userId:r.user_id, username:r.profiles.username, role:r.role,
    firstName:r.profiles.first_name, lastName:r.profiles.last_name, nickname:r.profiles.nickname,
  }));
  state.members = state.membersDetailed.map(m=>m.username);
}

async function inviteMemberSubmit(){
  state.inviteError = "";
  const slug = usernameToSlug(state.inviteUsername);
  if(!slug){ state.inviteError = "Введите логин друга."; render(); return; }
  const { data: found } = await supabaseClient.from("profiles").select("id, username").eq("username", slug).maybeSingle();
  if(!found){ state.inviteError = "Пользователь с таким логином не найден — сначала он должен зарегистрироваться."; render(); return; }
  if(state.membersDetailed.some(m=>m.userId===found.id)){ state.inviteError = "Этот пользователь уже в команде."; render(); return; }
  const { error } = await supabaseClient.from("team_members").insert({ team_id: state.activeTeamId, user_id: found.id, role:"member" });
  if(error){ state.inviteError = "Не удалось добавить: " + error.message; render(); return; }
  state.inviteUsername = "";
  await loadMembers(state.activeTeamId);
  render();
}

async function removeMember(userId, username){
  if(!confirm(`Исключить ${username} из команды?`)) return;
  await supabaseClient.from("team_members").delete().eq("team_id", state.activeTeamId).eq("user_id", userId);
  await loadMembers(state.activeTeamId);
  render();
}

async function promptResetPassword(userId, username){
  const pw = prompt(`Новый пароль для «${username}» (минимум 4 символа):`);
  if(!pw) return;
  if(pw.length < 4){ alert("Пароль слишком короткий."); return; }
  const { data, error } = await supabaseClient.functions.invoke("reset-password", {
    body: { teamId: state.activeTeamId, memberUserId: userId, newPassword: pw }
  });
  if(error || (data && data.error)){
    alert("Не удалось сбросить пароль: " + (data?.error || error?.message || "неизвестная ошибка"));
    return;
  }
  alert(`Пароль для «${username}» обновлён.`);
}

async function loadBoardData(teamId){
  const { data } = await supabaseClient.from("board").select("data").eq("id", teamId).maybeSingle();
  if(data){ state.data = data.data || { sessions: [] }; return; }
  await supabaseClient.from("board").insert({ id: teamId, data: { sessions: [] } });
  state.data = { sessions: [] };
}
async function saveData(){
  if(!state.activeTeamId) return;
  try{
    await supabaseClient.from("board").update({ data: state.data, updated_at: new Date().toISOString() }).eq("id", state.activeTeamId);
  }catch(e){ console.error("Не удалось сохранить в Supabase:", e); }
}
function subscribeBoardRealtime(teamId){
  state.realtimeChannel = supabaseClient
    .channel("board-changes-" + teamId)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "board", filter: `id=eq.${teamId}` }, (payload) => {
      if(payload.new && payload.new.data){ state.data = payload.new.data; render(); }
    })
    .subscribe();
}

// ======================================================================
// poker-night logic (roster = current team members)
// ======================================================================
function openSession(){ return (state.data.sessions||[]).find(s => s.status === "open"); }
function completedSessions(){
  return [...(state.data.sessions||[])].filter(s=>s.status==="completed").sort((a,b)=> a.date < b.date ? 1 : -1);
}

function computeLeaderboard(){
  const totals = {};
  state.members.forEach(p => totals[p] = {name:p, points:0, nights:0, champion:0, buster:0, bluffer:0, spent:0, won:0, moneyNights:0, rebuys:0});
  completedSessions().forEach(s => {
    Object.entries(s.picks||{}).forEach(([player, pick]) => {
      if(!totals[player]) totals[player] = {name:player, points:0, nights:0, champion:0, buster:0, bluffer:0, spent:0, won:0, moneyNights:0, rebuys:0};
      totals[player].nights += 1;
      CATS.forEach(c => { if(pick[c.key] && s.results && pick[c.key] === s.results[c.key]) totals[player].points += 1; });
    });
    CATS.forEach(c => {
      const w = s.results && s.results[c.key];
      if(w){
        if(!totals[w]) totals[w] = {name:w, points:0, nights:0, champion:0, buster:0, bluffer:0, spent:0, won:0, moneyNights:0, rebuys:0};
        totals[w][c.key] += 1;
      }
    });
    (s.participants||[]).forEach(player => {
      if(!totals[player]) totals[player] = {name:player, points:0, nights:0, champion:0, buster:0, bluffer:0, spent:0, won:0, moneyNights:0, rebuys:0};
      const rebuys = (s.rebuys && s.rebuys[player]) || 0;
      totals[player].spent += (1 + rebuys) * (s.buyIn || 0);
      totals[player].won += (s.payouts && s.payouts[player]) || 0;
      totals[player].rebuys += rebuys;
      totals[player].moneyNights += 1;
    });
  });
  return Object.values(totals).sort((a,b)=> b.points - a.points);
}

function setTab(t){ state.tab = t; state.resultsMode=false; render(); }

function startNight(){
  const buyIn = Number(state.newBuyIn) || 0;
  state.data.sessions = state.data.sessions || [];
  state.data.sessions.push({ id:"s_"+Date.now(), date: todayISO(), status:"open", picks:{}, results:null, buyIn, participants:[], rebuys:{} });
  saveData(); render();
}

function toggleParticipant(name){
  const os = openSession();
  if(!os) return;
  if(!os.participants) os.participants = [];
  if(os.participants.includes(name)){
    os.participants = os.participants.filter(p=>p!==name);
    if(os.rebuys) delete os.rebuys[name];
  }else{
    os.participants.push(name);
    if(!os.rebuys) os.rebuys = {};
    if(os.rebuys[name] === undefined) os.rebuys[name] = 0;
  }
  saveData(); render();
}

function changeRebuy(name, delta){
  const os = openSession();
  if(!os) return;
  if(!os.rebuys) os.rebuys = {};
  const next = Math.max(0, (os.rebuys[name]||0) + delta);
  os.rebuys[name] = next;
  saveData(); render();
}

function setBuyInAmount(value){
  const os = openSession();
  if(!os) return;
  os.buyIn = Number(value) || 0;
  saveData();
}

function setPick(cat, name){ state.picks[cat] = name; render(); }
function submitPicks(){
  const os = openSession();
  const my = state.profile?.username || "";
  if(!os || !my || !state.picks.champion || !state.picks.buster || !state.picks.bluffer) return;
  os.picks[my] = {...state.picks};
  saveData(); render();
}

function sessionPot(s){
  const participants = s.participants || [];
  const rebuys = s.rebuys || {};
  return participants.reduce((sum,p) => sum + (1+(rebuys[p]||0)) * (s.buyIn||0), 0);
}

function toggleResultsMode(v){
  if(v){
    const os = openSession();
    state.payouts = {};
    (os && os.participants || []).forEach(p => { state.payouts[p] = (os.payouts && os.payouts[p]) || 0; });
  }
  state.resultsMode = v;
  render();
}
function setResult(cat, name){ state.results[cat] = name; render(); }

function sumPayouts(){
  return Object.values(state.payouts||{}).reduce((a,b)=> a + (Number(b)||0), 0);
}
function onPayoutInput(el, name){
  state.payouts[name] = Number(el.value) || 0;
  const os = openSession();
  const pot = os ? sessionPot(os) : 0;
  const sum = sumPayouts();
  const span = document.getElementById("payoutTotal");
  if(span){
    span.textContent = `${sum} / ${pot} ₽`;
    span.style.color = (sum !== pot) ? "var(--red)" : "var(--gold)";
  }
}

function submitResults(){
  const os = openSession();
  if(!os || !state.results.champion || !state.results.buster || !state.results.bluffer) return;
  os.status = "completed";
  os.results = {...state.results};
  os.payouts = {...state.payouts};
  state.results = {champion:"", buster:"", bluffer:""};
  state.payouts = {};
  state.resultsMode = false;
  state.me = ""; state.picks = {champion:"", buster:"", bluffer:""};
  saveData(); render();
}

function toggleHistory(id){ state.expandedHistory = state.expandedHistory===id ? null : id; render(); }

function deleteSession(id){
  if(!confirm("Удалить этот вечер из истории? Это действие нельзя отменить.")) return;
  state.data.sessions = state.data.sessions.filter(s => s.id !== id);
  saveData(); render();
}

function clearAllHistory(){
  if(!confirm("Очистить всю статистику и историю вечеров? Список участников останется, но все прошлые результаты, очки и финансы удалятся безвозвратно.")) return;
  state.data.sessions = state.data.sessions.filter(s => s.status !== "completed");
  saveData(); render();
}

function pluralRu(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10===1 && mod100!==11) return one;
  if(mod10>=2 && mod10<=4 && (mod100<10 || mod100>=20)) return few;
  return many;
}

function setHallTab(key){ state.hallTab = key; render(); }
function toggleFinanceUser(username){ state.expandedFinanceUser = state.expandedFinanceUser===username ? null : username; render(); }
function financeGamesFor(username){
  return completedSessions()
    .filter(s => (s.participants||[]).includes(username))
    .map(s => {
      const rebuys = (s.rebuys && s.rebuys[username]) || 0;
      const spent = (1+rebuys) * (s.buyIn||0);
      const won = (s.payouts && s.payouts[username]) || 0;
      return { date: s.date, net: won - spent };
    })
    .sort((a,b)=> a.date < b.date ? 1 : -1);
}

          <div class="row">
            <span>${esc(displayNameFor(p))}</span>
            <span style="display:flex; align-items:center; gap:6px;">
              <input type="text" inputmode="numeric" value="${esc(String(state.payouts[p]||0))}" oninput="onPayoutInput(this,'${esc(p)}')" style="width:80px; text-align:right; padding:5px 8px;"> ₽
            </span>
          </div>
        `).join("")}
      </div>
      <div class="section-label" style="margin-bottom:0;">
        <span>Роздано</span>
        <span id="payoutTotal" style="color:${sum!==pot?'var(--red)':'var(--gold)'}; font-family:'JetBrains Mono', monospace;">${sum} / ${pot} ₽</span>
      </div>
    </div>
  `;
}

// ======================================================================
// render: leaderboard
// ======================================================================
function renderLeaderboard(){
  const lb = computeLeaderboard();
  const predictors = lb.filter(p => p.nights > 0).sort((a,b)=> b.points - a.points);
  const maxPoints = Math.max(1, ...predictors.map(p=>p.points));
  const medals = ["🥇","🥈","🥉"];
  const predictorsHtml = predictors.map((p,i) => {
    const pct = Math.round((p.points / maxPoints) * 100);
    return `
      <div class="row" style="flex-direction:column; align-items:stretch; gap:7px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:700; display:flex; align-items:center; gap:6px;">
            <span style="min-width:22px;">${medals[i] || ('#'+(i+1))}</span> ${esc(displayNameFor(p.name))}
          </span>
          <span style="font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--gold);">${p.points} ${pluralRu(p.points,'очко','очка','очков')}</span>
        </div>
        <div style="height:6px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden;">
          <div style="height:100%; width:${pct}%; background:linear-gradient(90deg, var(--gold), #7de08a); border-radius:4px;"></div>
        </div>
      </div>
    `;
  }).join("");

  const hallTabs = [
    { key:"champion", label:"Чемпионы" },
    { key:"bluffer", label:"Лучшая раздача" },
    { key:"buster", label:"Первый вылет" },
  ];
  const hallKey = state.hallTab || "champion";
  const hallList = lb.filter(p => p[hallKey] > 0)
    .sort((a,b)=> b[hallKey] - a[hallKey])
    .map(p => `
      <div class="row">
        <span style="font-weight:bold;">${esc(displayNameFor(p.name))}</span>
        <span class="${hallKey==='buster'?'suit-red':'suit-gold'}" style="font-family:'JetBrains Mono', monospace; font-weight:700;">${p[hallKey]}×</span>
      </div>
    `).join("");

  const moneyList = lb.filter(p => p.moneyNights > 0)
    .sort((a,b)=> (b.won-b.spent) - (a.won-a.spent))
    .map(p => {
      const net = p.won - p.spent;
      const open = state.expandedFinanceUser === p.name;
      const games = open ? financeGamesFor(p.name) : [];
      return `
      <div class="row" style="flex-direction:column; align-items:stretch; cursor:pointer;" onclick="toggleFinanceUser('${esc(p.name)}')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:bold;">${esc(displayNameFor(p.name))}</span>
          <span class="dim" style="display:flex; gap:10px; align-items:center;">
            <span>${p.moneyNights} вечеров</span>
            <span>${p.rebuys} докупок</span>
            <span style="color:${net>=0?'#7CFFC4':'var(--red)'}; font-family:'JetBrains Mono', monospace; font-weight:bold;">${net>=0?'+':''}${net} ₽</span>
          </span>
        </div>
        ${open ? `
          <div style="margin-top:8px; display:flex; flex-direction:column; gap:4px; border-top:1px solid rgba(255,255,255,0.08); padding-top:8px;">
            ${games.length ? games.map(g => `
              <div class="dim" style="display:flex; justify-content:space-between; font-size:12px;">
                <span>${fmtDate(g.date)}</span>
                <span style="color:${g.net>=0?'#7CFFC4':'var(--red)'}; font-family:'JetBrains Mono', monospace;">${g.net>=0?'+':''}${g.net} ₽</span>
              </div>
            `).join("") : `<p class="dim">Игр не найдено.</p>`}
          </div>
        ` : ``}
      </div>
    `;}).join("");

  return `
    <div class="panel">
      <div class="section-label">Самые точные прогнозы</div>
      ${predictorsHtml || `<p class="dim">Очков пока нет — они появятся после первого закрытого вечера.</p>`}
    </div>
    <div class="panel">
      <div class="section-label">Зал славы</div>
      <div class="chip-group">
        ${hallTabs.map(t => `<span class="chip ${hallKey===t.key?'active':''}" onclick="setHallTab('${t.key}')">${t.label}</span>`).join("")}
      </div>
      ${hallList || `<p class="dim">Пока никого нет в этой категории.</p>`}
    </div>
    <div class="panel">
      <div class="section-label">💰 Финансы</div>
      ${moneyList || `<p class="dim">Пока никто не платил бай-ин.</p>`}
    </div>
    ${completedSessions().length ? `<button class="btn ghost block" onclick="clearAllHistory()">Очистить всю статистику</button>` : ``}
  `;
}

// ======================================================================
// render: history
// ======================================================================
function renderHistory(){
  const list = completedSessions();
  if(list.length === 0) return `<div class="panel center"><p class="dim">Записей о вечерах пока нет.</p></div>`;
  return list.map(s => {
    const open = state.expandedHistory === s.id;
    const participants = s.participants || [];
    const rebuys = s.rebuys || {};
    const total = participants.reduce((sum,p) => sum + (1+(rebuys[p]||0)) * (s.buyIn||0), 0);
    const picksHtml = `
      <div class="dim" style="margin-bottom:8px;">🎯 Прогнозы игроков</div>
      ${Object.keys(s.picks).length ? Object.entries(s.picks).map(([player,pick]) => `
        <div class="row" style="background:transparent; padding:4px 0;">
          <span class="dim">${esc(displayNameFor(player))}</span>
          <span style="display:flex; gap:10px;">
            ${CATS.map(c => {
              const correct = pick[c.key] === s.results[c.key];
              return `<span title="${esc(c.label)}" style="color:${correct?'var(--gold)':'var(--cream-dim)'};font-size:12px;">${c.suit} ${correct?'✓':'✕'} ${esc(pick[c.key]||'—')}</span>`;
            }).join("")}
          </span>
        </div>
      `).join("") : `<p class="dim">В этот вечер никто не делал прогнозов.</p>`}
    `;
    const moneyHtml = participants.length ? `
      <div style="margin-top:10px; border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">
        <div class="dim" style="margin-bottom:6px;">💰 Бай-ин ${s.buyIn||0} ₽ · банк ${total} ₽</div>
        ${participants.map(p => {
          const spent = (1+(rebuys[p]||0))*(s.buyIn||0);
          const won = (s.payouts && s.payouts[p]) || 0;
          const net = won - spent;
          return `
          <div class="row" style="background:transparent; padding:4px 0;">
            <span class="dim">${esc(displayNameFor(p))}</span>
            <span class="dim" style="display:flex; gap:8px; align-items:center;">
              <span>докупок: ${rebuys[p]||0}</span>
              <span>получил ${won} ₽</span>
              <span style="color:${net>=0?'#7CFFC4':'var(--red)'}; font-weight:bold;">${net>=0?'+':''}${net} ₽</span>
            </span>
          </div>
        `;}).join("")}
      </div>
    ` : "";
    return `
      <div class="panel">
        <div class="row" style="background:transparent; padding:0; margin-bottom:10px;">
          <span style="font-weight:700;">${fmtDate(s.date)}</span>
          <span class="del" title="Удалить вечер" onclick="deleteSession('${s.id}')">✕</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
          ${CATS.map(c => `
            <div class="row" style="background:rgba(255,255,255,0.03);">
              <span class="dim" style="display:flex; align-items:center; gap:7px;"><span class="${c.cls}" style="font-size:15px;">${c.suit}</span> ${c.label}</span>
              <span style="font-weight:700; color:var(--cream);">${esc(s.results[c.key]||'—')}</span>
            </div>
          `).join("")}
        </div>
        <button class="btn ghost block" onclick="toggleHistory('${s.id}')">${open ? 'Скрыть прогнозы и деньги' : 'Прогнозы и деньги »'}</button>
        ${open ? `<div style="margin-top:12px; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">${picksHtml}</div>${moneyHtml}` : ``}
      </div>
    `;
  }).join("");
}

// ======================================================================
// render: team management
// ======================================================================
function renderTeam(){
  const activeTeam = state.teams.find(t=>t.id===state.activeTeamId);
  const isOwner = activeTeam?.role === "owner";
  return `
    <div class="panel">
      <div class="section-label">Мои команды</div>
      <div class="chip-group">
        ${state.teams.length ? state.teams.map(t=>`<span class="chip ${t.id===state.activeTeamId?'active':''}" onclick="selectTeam('${t.id}')">${esc(t.name)}${t.role==='owner'?' 👑':''}</span>`).join("") : `<p class="dim">Команд пока нет.</p>`}
      </div>
      <div style="display:flex; gap:8px;">
        <input type="text" placeholder="Название новой команды" value="${esc(state.newTeamName)}" oninput="state.newTeamName=this.value" style="flex:1;">
        <button class="btn gold" onclick="createTeamSubmit()">+ Создать</button>
      </div>
    </div>

    ${state.activeTeamId ? `
      <div class="panel">
        <div class="section-label">Участники «${esc(activeTeam?.name||'')}»</div>
        ${state.membersDetailed.map(m => `
          <div class="row">
            <span>${esc(nameFromRecord(m))}${m.role==='owner'?' 👑':''}</span>
            ${isOwner && m.role!=='owner' ? `
              <span style="display:flex; gap:10px; align-items:center;">
                <span class="dim" style="cursor:pointer;" onclick="promptResetPassword('${m.userId}','${esc(nameFromRecord(m))}')">сбросить пароль</span>
                <span class="del" title="Исключить из команды" onclick="removeMember('${m.userId}','${esc(nameFromRecord(m))}')">✕</span>
              </span>
            ` : ``}
          </div>
        `).join("")}
        ${isOwner ? `
          <div style="margin-top:10px;">
            ${state.inviteError ? `<p class="msg-error" style="margin-bottom:6px;">${esc(state.inviteError)}</p>` : ``}
            <div style="display:flex; gap:8px;">
              <input type="text" placeholder="Логин друга" value="${esc(state.inviteUsername)}" oninput="state.inviteUsername=this.value" style="flex:1;">
              <button class="btn gold" onclick="inviteMemberSubmit()">Пригласить</button>
            </div>
          </div>
        ` : `<p class="dim" style="margin-top:8px;">Приглашать новых участников может только владелец команды.</p>`}
      </div>
    ` : `<div class="panel center"><p class="dim">Вы пока не состоите ни в одной команде. Создайте свою выше или попросите владельца команды друзей пригласить вас по логину «${esc(state.profile?.username||'')}».</p></div>`}
  `;
}

// ======================================================================
// top-level render
// ======================================================================
function focusFirstInput(){
  const el = document.getElementById("authUsernameInput");
  if(el) el.focus({preventScroll:true});
}

function render(){
  const accountBarEl = document.getElementById("accountBar");
  const tabsEl = document.getElementById("tabs");
  const contentEl = document.getElementById("content");

  if(state.booting){
    accountBarEl.innerHTML = ""; tabsEl.innerHTML = "";
    contentEl.innerHTML = `<div class="panel center"><p>Загрузка…</p></div>`;
    return;
  }

  if(!state.session){
    accountBarEl.innerHTML = ""; tabsEl.innerHTML = "";
    contentEl.innerHTML = renderAuthScreen();
    focusFirstInput();
    return;
  }

  accountBarEl.innerHTML = renderAccountBar();

  if(state.settingsOpen){
    tabsEl.innerHTML = "";
    contentEl.innerHTML = renderSettings();
    return;
  }

  if(!state.activeTeamId){ state.tab = "team"; }

  tabsEl.innerHTML = renderTabs();

  if(state.dataLoading && state.tab !== "team"){
    contentEl.innerHTML = `<div class="panel center"><p>Загружаем данные команды…</p></div>`;
    return;
  }

  if(state.tab === "tonight") contentEl.innerHTML = renderTonight();
  else if(state.tab === "leaderboard") contentEl.innerHTML = renderLeaderboard();
  else if(state.tab === "history") contentEl.innerHTML = renderHistory();
  else if(state.tab === "team") contentEl.innerHTML = renderTeam();
}

// ======================================================================
// bootstrap
// ======================================================================
async function initApp(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){
    await onAuthReady(session);
  }else{
    state.booting = false;
    render();
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if(event === "SIGNED_IN" && !state.session){
      onAuthReady(session);
    }
    if(event === "SIGNED_OUT"){
      if(state.realtimeChannel){ supabaseClient.removeChannel(state.realtimeChannel); state.realtimeChannel = null; }
      state.session = null; state.profile = null;
      state.teams = []; state.activeTeamId = null;
      state.members = []; state.membersDetailed = [];
      state.data = { sessions: [] };
      state.tab = "tonight";
      state.booting = false;
      render();
    }
  });
}
initApp();
</script>
